name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-release:
    name: Build release Executable (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform independently; one failure must not hide the rest.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-amd64
          - os: windows-latest
            target: windows-amd64
            ext: .exe
    env:
      # Target-prefixed so artifact names, release asset names and the file
      # basename are all one string and cannot collide across jobs.
      BIN: ${{ matrix.target }}-simple-file-server${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v7

      - name: Install deps for linux build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libgl-dev libglvnd-dev xorg-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          go build -v -trimpath -o "dist/$BIN" ./cmd/...

      - name: Evaluate shasum
        shell: bash
        run: shasum -ba 256 "dist/$BIN" | cut -d " " -f 1 > "dist/$BIN.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: '[Optional] Publish Artifacts'
        if: ${{ github.event_name == 'release' }}
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          check_duplicates: false
